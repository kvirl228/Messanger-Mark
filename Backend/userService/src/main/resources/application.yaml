spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/User
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - app_schema
    baseline-on-migrate: true

    jpa:
      show-sql: true
      hibernate:
        ddl-auto: none

server:
  port: 8031

logging:
  level:
    org.flywaydb: DEBUG