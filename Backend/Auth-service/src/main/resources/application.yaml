spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/UsersAuth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - public
    baseline-on-migrate: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

server:
  port: 8030

logging:
  level:
    org.flywaydb: DEBUG